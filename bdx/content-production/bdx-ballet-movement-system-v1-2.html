<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="BDX MOVE制作のための、動作選択・組み合わせ・発展基盤。" />
  <title>BDX バレエ動作体系 v1.2</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&amp;family=Noto+Sans+JP:wght@300;400;500;600&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #f7f6f4;
      --surface: #ffffff;
      --surface-hi: #fff8fa;
      --surface-soft: #f3f1f2;
      --accent: #e65b82;
      --accent-bright: #ff6f91;
      --accent-strong: #a62e54;
      --accent-soft: #fff0f4;
      --accent-line: #efb5c5;
      --blue: #5d80cf;
      --blue-soft: #eef3ff;
      --mint: #358f75;
      --text: #1c191d;
      --muted: #5e595e;
      --subtle: #8a8388;
      --line: #e1dcdf;
      --line-strong: #cbc3c8;
      --radius: 14px;
      --sans: 'Inter', 'Noto Sans JP', sans-serif;
      --serif: 'Cormorant Garamond', 'Noto Sans JP', serif;
    }
    html {
      scroll-behavior: smooth;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }
    body {
      min-width: 0;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 8% -4%, rgba(255,111,145,0.13), transparent 32rem),
        radial-gradient(circle at 100% 27%, rgba(93,128,207,0.08), transparent 38rem),
        linear-gradient(180deg, #ffffff 0%, var(--bg) 24rem, #faf9f7 100%);
    }
    a { color: inherit; }
    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(18px);
      box-shadow: 0 6px 20px rgba(53,35,43,0.035);
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-decoration: none;
      transition: color 0.25s;
    }
    .back-link:hover { color: var(--accent-strong); }
    .back-link::before { content: '←'; color: var(--accent); font-size: 15px; }
    .brand {
      color: var(--accent-strong);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }
    .reading-progress {
      position: fixed;
      inset: 57px auto auto 0;
      z-index: 51;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright), var(--blue));
      box-shadow: 0 2px 9px rgba(230,91,130,0.24);
    }
    .layout {
      display: grid;
      grid-template-columns: 230px minmax(0, 900px);
      gap: clamp(34px, 5vw, 72px);
      width: min(1220px, calc(100% - 48px));
      margin: 0 auto;
      padding: 64px 0 100px;
    }
    .toc-shell { min-width: 0; }
    .toc {
      position: sticky;
      top: 92px;
      max-height: calc(100vh - 124px);
      overflow-y: auto;
      padding: 20px 0 20px 18px;
      border-left: 1px solid var(--line);
      scrollbar-width: thin;
      scrollbar-color: var(--accent-line) transparent;
    }
    .toc-label {
      display: block;
      margin-bottom: 14px;
      color: var(--accent-strong);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.28em;
    }
    .toc a {
      display: block;
      margin-left: -19px;
      padding: 7px 10px 7px 18px;
      border-left: 2px solid transparent;
      color: var(--subtle);
      font-size: 10px;
      line-height: 1.55;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .toc a:hover,
    .toc a.active {
      border-left-color: var(--accent);
      background: linear-gradient(90deg, var(--accent-soft), transparent);
      color: var(--text);
    }
    .report { min-width: 0; }
    .loading,
    .load-error {
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.9;
    }
    .load-error a { color: var(--accent-strong); }
    .report > h1:first-child {
      position: relative;
      margin: 0 0 24px;
      padding: 84px 0 30px;
      font-family: var(--serif);
      font-size: clamp(3.1rem, 7.2vw, 6.4rem);
      font-weight: 300;
      letter-spacing: 0.07em;
      line-height: 0.98;
    }
    .report > h1:first-child::before {
      content: 'BDX / MOVEMENT SYSTEM';
      position: absolute;
      top: 28px;
      left: 0;
      color: var(--accent-strong);
      font-family: var(--sans);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.32em;
    }
    .report > h1:first-child::after {
      content: '';
      display: block;
      width: 64px;
      height: 1px;
      margin-top: 30px;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright));
    }
    .report > h1:first-child + blockquote {
      margin: 0 0 34px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-family: var(--serif);
      font-size: clamp(1.15rem, 2.2vw, 1.55rem);
      letter-spacing: 0.05em;
      line-height: 1.8;
    }
    .report h2 {
      scroll-margin-top: 84px;
      margin: 96px 0 28px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
      font-family: var(--serif);
      font-size: clamp(2rem, 4.3vw, 3.7rem);
      font-weight: 300;
      font-variant-numeric: lining-nums tabular-nums;
      font-feature-settings: 'lnum' 1, 'tnum' 1;
      letter-spacing: 0.05em;
      line-height: 1.2;
    }
    .report h2::before {
      content: attr(data-index);
      display: block;
      margin-bottom: 12px;
      color: var(--accent-strong);
      font-family: var(--sans);
      font-size: 9px;
      font-weight: 600;
      font-variant-numeric: lining-nums tabular-nums;
      font-feature-settings: 'lnum' 1, 'tnum' 1;
      letter-spacing: 0.28em;
    }
    .report h3 {
      scroll-margin-top: 84px;
      margin: 52px 0 18px;
      color: var(--text);
      font-family: var(--serif);
      font-size: clamp(1.4rem, 2.7vw, 2rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1.4;
    }
    .report h4 {
      margin: 34px 0 14px;
      color: var(--accent-strong);
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.06em;
    }
    .report p,
    .report li {
      color: var(--muted);
      font-size: 0.91rem;
      line-height: 2;
      letter-spacing: 0.035em;
    }
    .report p { margin: 14px 0; }
    .report strong { color: var(--text); font-weight: 500; }
    .report ul,
    .report ol { margin: 18px 0 28px; padding-left: 1.5em; }
    .report li { margin: 8px 0; padding-left: 0.25em; }
    .report li::marker { color: var(--accent); }
    .report blockquote {
      margin: 28px 0;
      padding: 20px 24px;
      border: 1px solid var(--accent-line);
      border-left: 4px solid var(--accent);
      border-radius: 0 var(--radius) var(--radius) 0;
      background: linear-gradient(90deg, var(--accent-soft), #fff 78%);
    }
    .report blockquote p { margin: 0; color: #4d454b; }
    .report hr {
      height: 1px;
      margin: 76px 0;
      border: 0;
      background: linear-gradient(90deg, transparent, var(--accent-line), transparent);
    }
    .report table {
      display: table;
      width: 100%;
      margin: 24px 0 38px;
      border-collapse: separate;
      border-spacing: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: 0 8px 26px rgba(49,34,41,0.035);
      font-size: 11px;
      line-height: 1.65;
    }
    .report th,
    .report td {
      padding: 12px 13px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      text-align: left;
    }
    .report th:last-child,
    .report td:last-child { border-right: 0; }
    .report tr:last-child td { border-bottom: 0; }
    .report th {
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .report td { color: #4c474b; }
    .report tbody tr:hover td { background: #fff9fb; }
    .movement-cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin: 24px 0 44px;
    }
    .movement-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid #ddd6da;
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 10px 30px rgba(56,35,44,0.055);
    }
    .report .movement-card h4 {
      margin: 0;
      padding: 18px 20px;
      border-top: 4px solid var(--accent);
      border-bottom: 1px solid var(--accent-line);
      background: linear-gradient(100deg, var(--accent-soft), #fff 68%);
      color: var(--text);
      font-family: var(--serif);
      font-size: 1.35rem;
      font-weight: 500;
      letter-spacing: 0.045em;
      line-height: 1.35;
    }
    .movement-group + .movement-group { border-top: 1px solid var(--line-strong); }
    .movement-group-label {
      margin: 0 !important;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 16px;
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      color: var(--accent-strong) !important;
      font-size: 10px !important;
      font-weight: 700;
      letter-spacing: 0.14em !important;
      line-height: 1.4 !important;
    }
    .movement-group-label::before {
      content: '';
      flex: 0 0 auto;
      width: 7px;
      height: 7px;
      border: 2px solid currentColor;
      border-radius: 50%;
    }
    .movement-group + .movement-group .movement-group-label {
      border-left-color: var(--accent-bright);
      background: #242026;
      color: #ffffff !important;
    }
    .movement-group + .movement-group .movement-group-label::before {
      border-color: var(--accent-bright);
      background: var(--accent-bright);
    }
    .movement-fields { margin: 0; }
    .movement-field {
      display: grid;
      grid-template-columns: minmax(108px, 0.35fr) minmax(0, 1fr);
      gap: 12px;
      margin: 0;
      padding: 10px 16px;
      border-top: 1px solid var(--line);
    }
    .movement-field dt {
      color: var(--accent-strong);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.045em;
      line-height: 1.7;
    }
    .movement-field dd {
      min-width: 0;
      margin: 0;
      color: #423d41;
      font-size: 10.5px;
      letter-spacing: 0.02em;
      line-height: 1.75;
      overflow-wrap: anywhere;
    }
    .report code {
      color: var(--accent-strong);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.86em;
    }
    .report p code,
    .report td code {
      padding: 2px 6px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--accent-soft);
    }
    .report pre {
      margin: 24px 0 34px;
      padding: 20px 22px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f5f2f4;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .report pre code { color: #413b40; font-size: 11px; line-height: 1.9; }
    .mermaid {
      margin: 26px 0 38px;
      padding: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 8px 26px rgba(49,34,41,0.035);
      text-align: center;
    }
    .mermaid svg { display: block; max-width: 100% !important; height: auto !important; margin: 0 auto; }
    .source-note {
      margin-top: 86px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      color: var(--subtle);
      font-size: 9px;
      letter-spacing: 0.1em;
    }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; width: min(900px, calc(100% - 40px)); padding-top: 28px; }
      .toc-shell { display: none; }
      .report > h1:first-child { padding-top: 74px; }
    }
    @media (max-width: 680px) {
      .site-header { min-height: 52px; padding: 0 16px; }
      .brand { font-size: 8px; letter-spacing: 0.18em; }
      .back-link { font-size: 9px; }
      .reading-progress { top: 51px; }
      .layout { width: min(100% - 28px, 900px); padding: 12px 0 70px; }
      .report > h1:first-child { padding-top: 70px; font-size: clamp(2.5rem, 13vw, 4rem); letter-spacing: 0.035em; }
      .report h2 {
        margin-top: 72px;
        padding-top: 24px;
        font-size: clamp(1.95rem, 9.5vw, 2.65rem);
        letter-spacing: 0.025em;
        line-height: 1.28;
        text-wrap: balance;
      }
      .report h2::before { margin-bottom: 14px; line-height: 1; }
      .report h3 { margin-top: 42px; }
      .report p,
      .report li { font-size: 0.87rem; line-height: 1.9; }
      .report blockquote { padding: 18px; }
      .report table,
      .report thead,
      .report tbody,
      .report tr,
      .report th,
      .report td { display: block; width: 100%; }
      .report table { border: 0; border-radius: 0; background: transparent; }
      .report thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .report tbody { display: grid; gap: 10px; }
      .report tr {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
      }
      .report td {
        display: grid;
        grid-template-columns: minmax(88px, 0.36fr) minmax(0, 1fr);
        gap: 12px;
        padding: 10px 12px;
        border-right: 0;
        color: #423d41;
        font-size: 10px;
      }
      .report td::before {
        content: attr(data-label);
        color: var(--accent-strong);
        font-size: 8px;
        font-weight: 600;
        letter-spacing: 0.05em;
      }
      .report tr:last-child td { border-bottom: 1px solid var(--line); }
      .report tr td:last-child { border-bottom: 0; }
      .movement-cards { grid-template-columns: 1fr; gap: 12px; margin-bottom: 36px; }
      .report .movement-card h4 { padding: 16px 14px; font-size: 1.25rem; }
      .movement-group-label { padding: 10px 12px; font-size: 9.5px !important; }
      .movement-field {
        grid-template-columns: minmax(92px, 0.38fr) minmax(0, 1fr);
        gap: 10px;
        padding: 10px 12px;
      }
      .movement-field dt { font-size: 8.5px; }
      .movement-field dd { font-size: 10px; line-height: 1.8; }
      .report pre { padding: 16px; }
      .mermaid { padding: 14px 8px; }
    }
    @media print {
      :root { --bg: #fff; --surface: #fff; --surface-hi: #fff; --text: #171717; --muted: #424242; --subtle: #777; --line: #d8d3d6; --line-strong: #bdb5ba; --accent-line: #d8a3b2; }
      body { background: #fff; color: #171717; }
      .site-header,
      .reading-progress,
      .toc-shell { display: none !important; }
      .layout { display: block; width: auto; margin: 0; padding: 0; }
      .report > h1:first-child { padding-top: 32mm; page-break-after: avoid; }
      .report h2 { margin-top: 18mm; page-break-after: avoid; }
      .report h3 { page-break-after: avoid; }
      .report p,
      .report li,
      .report td { color: #333; }
      .report table { font-size: 7.4pt; page-break-inside: auto; }
      .report tr { page-break-inside: avoid; }
      .report th { color: #7f2946; background: #fff0f4; }
      .report blockquote,
      .report pre,
      .mermaid { page-break-inside: avoid; background: #fff9fb; }
      .movement-cards { display: block; }
      .movement-card { margin: 0 0 5mm; page-break-inside: avoid; background: #fff; }
      .movement-field dt { color: #7f2946; }
      .movement-field dd { color: #333; }
      .source-note { display: none; }
      @page { size: A4 portrait; margin: 15mm; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="./">コンテンツ制作</a>
    <span class="brand">Body Design Experience</span>
  </header>
  <div class="reading-progress" id="reading-progress" aria-hidden="true"></div>

  <main class="layout">
    <aside class="toc-shell" aria-label="ページ内ナビゲーション">
      <nav class="toc" id="toc"><span class="toc-label">CONTENTS</span></nav>
    </aside>
    <article class="report" id="report" aria-live="polite">
      <p class="loading">BDX バレエ動作体系を読み込んでいます。</p>
    </article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    (() => {
      const report = document.getElementById('report');
      const toc = document.getElementById('toc');
      const progress = document.getElementById('reading-progress');
      const markdownUrl = '../../docs/content/BDX_BALLET_MOVEMENT_SYSTEM_V1_2.md';

      const makeId = (text, index) => {
        const normalized = text
          .trim()
          .toLowerCase()
          .replace(/[\s　]+/g, '-')
          .replace(/[^\p{L}\p{N}ー・-]/gu, '')
          .replace(/-+/g, '-')
          .replace(/^-|-$/g, '');
        return normalized || `section-${index + 1}`;
      };

      const prepareTables = () => {
        report.querySelectorAll('table').forEach((table) => {
          const labels = Array.from(table.querySelectorAll('thead th')).map((cell) => cell.textContent.trim());
          table.querySelectorAll('tbody tr').forEach((row) => {
            Array.from(row.children).forEach((cell, index) => {
              cell.dataset.label = labels[index] || `項目 ${index + 1}`;
            });
          });
        });
      };

      const prepareMovementCards = () => {
        const movementSections = Array.from(report.querySelectorAll('h3'))
          .filter((heading) => heading.textContent.trim() === '動作');

        movementSections.forEach((sectionHeading) => {
          const grid = document.createElement('div');
          grid.className = 'movement-cards';
          let current = sectionHeading.nextElementSibling;

          while (current && !['H2', 'H3', 'HR'].includes(current.tagName)) {
            if (current.tagName !== 'H4' || current.nextElementSibling?.tagName !== 'TABLE') {
              current = current.nextElementSibling;
              continue;
            }

            const title = current;
            const table = current.nextElementSibling;
            const next = table.nextElementSibling;
            const card = document.createElement('section');
            card.className = 'movement-card';
            card.setAttribute('aria-label', title.textContent.trim());
            card.appendChild(title);

            let group = null;
            let fields = null;
            table.querySelectorAll('tbody tr').forEach((row) => {
              const label = row.children[0]?.textContent.trim() || '';
              const value = row.children[1]?.textContent.trim() || '';
              if (label === '動作概要' || label === '前提となる動作') {
                group = document.createElement('div');
                group.className = 'movement-group';
                const groupLabel = document.createElement('p');
                groupLabel.className = 'movement-group-label';
                groupLabel.textContent = label === '動作概要' ? '基本情報' : '制作情報';
                fields = document.createElement('dl');
                fields.className = 'movement-fields';
                group.append(groupLabel, fields);
                card.appendChild(group);
              }

              const field = document.createElement('div');
              field.className = 'movement-field';
              const term = document.createElement('dt');
              const description = document.createElement('dd');
              term.textContent = label;
              description.textContent = value;
              field.append(term, description);
              fields?.appendChild(field);
            });

            table.remove();
            grid.appendChild(card);
            current = next;
          }

          sectionHeading.insertAdjacentElement('afterend', grid);
        });
      };

      const prepareNavigation = () => {
        const headings = Array.from(report.querySelectorAll('h2'));
        const used = new Set();
        headings.forEach((heading, index) => {
          const rawText = heading.textContent.trim();
          let id = makeId(rawText, index);
          while (used.has(id)) id = `${id}-${index + 1}`;
          used.add(id);
          heading.id = id;
          const numbered = rawText.match(/^(\d+)\.\s*(.+)$/);
          heading.dataset.index = numbered
            ? numbered[1].padStart(2, '0')
            : rawText.startsWith('付録')
              ? 'APPENDIX'
              : 'CONTENTS';
          if (numbered) heading.textContent = numbered[2];
          const link = document.createElement('a');
          link.href = `#${id}`;
          link.textContent = rawText;
          toc.appendChild(link);
        });

        const links = Array.from(toc.querySelectorAll('a'));
        const observer = new IntersectionObserver((entries) => {
          const visible = entries.filter((entry) => entry.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
          if (!visible) return;
          links.forEach((link) => link.classList.toggle('active', link.getAttribute('href') === `#${visible.target.id}`));
        }, { rootMargin: '-18% 0px -70% 0px', threshold: 0 });
        headings.forEach((heading) => observer.observe(heading));
      };

      const prepareMermaid = async () => {
        const nodes = [];
        report.querySelectorAll('pre code.language-mermaid').forEach((code) => {
          const diagram = document.createElement('div');
          diagram.className = 'mermaid';
          diagram.textContent = code.textContent;
          code.parentElement.replaceWith(diagram);
          nodes.push(diagram);
        });
        if (!nodes.length || !window.mermaid) return;
        window.mermaid.initialize({
          startOnLoad: false,
          theme: 'base',
          securityLevel: 'strict',
          fontFamily: "Inter, 'Noto Sans JP', sans-serif",
          themeVariables: {
            background: '#ffffff',
            primaryColor: '#fff0f4',
            primaryTextColor: '#1c191d',
            primaryBorderColor: '#e65b82',
            lineColor: '#a62e54',
            secondaryColor: '#eef3ff',
            secondaryTextColor: '#1c191d',
            secondaryBorderColor: '#5d80cf',
            tertiaryColor: '#f7f6f4',
            tertiaryTextColor: '#1c191d',
            tertiaryBorderColor: '#cbc3c8'
          },
          flowchart: { curve: 'basis', htmlLabels: true }
        });
        await window.mermaid.run({ nodes });
      };

      const updateProgress = () => {
        const max = document.documentElement.scrollHeight - window.innerHeight;
        const ratio = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
        progress.style.width = `${ratio * 100}%`;
      };
      window.addEventListener('scroll', updateProgress, { passive: true });

      const load = async () => {
        try {
          const response = await fetch(markdownUrl, { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          if (!window.marked) throw new Error('Markdown renderer unavailable');
          const markdown = await response.text();
          report.innerHTML = window.marked.parse(markdown, { gfm: true, breaks: false });
          prepareMovementCards();
          prepareTables();
          prepareNavigation();
          await prepareMermaid();
          const note = document.createElement('p');
          note.className = 'source-note';
          note.textContent = 'SOURCE OF TRUTH · BDX_BALLET_MOVEMENT_SYSTEM_V1_2.md';
          report.appendChild(note);
          updateProgress();
        } catch (error) {
          report.innerHTML = `<div class="load-error">資料を読み込めませんでした。<br><a href="${markdownUrl}">Markdown版を開く</a></div>`;
        }
      };

      load();
    })();
  </script>
  <noscript>
    <p class="load-error"><a href="../../docs/content/BDX_BALLET_MOVEMENT_SYSTEM_V1_2.md">Markdown版を開く</a></p>
  </noscript>
</body>
