<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="BDX MOVE制作のための、動作選択・組み合わせ・発展基盤。" />
  <title>BDX バレエ動作体系 v1.1</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&amp;family=Noto+Sans+JP:wght@300;400;500;600&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #090909;
      --surface: #121212;
      --surface-hi: #191714;
      --surface-soft: rgba(255,255,255,0.025);
      --gold: #c9a96e;
      --gold-bright: #e0bf81;
      --gold-soft: rgba(201,169,110,0.1);
      --text: #f2ede6;
      --muted: #aaa298;
      --subtle: #6e675f;
      --line: rgba(255,255,255,0.09);
      --line-gold: rgba(201,169,110,0.32);
      --career: #6e8fdb;
      --danger: #dc7c88;
      --radius: 14px;
      --sans: 'Inter', 'Noto Sans JP', sans-serif;
      --serif: 'Cormorant Garamond', 'Noto Sans JP', serif;
    }
    html {
      scroll-behavior: smooth;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }
    body {
      min-width: 0;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 15% -5%, rgba(201,169,110,0.1), transparent 34rem),
        radial-gradient(circle at 100% 30%, rgba(110,143,219,0.055), transparent 36rem),
        linear-gradient(180deg, #0d0c0b 0%, #090909 28%, #0b0a09 100%);
    }
    a { color: inherit; }
    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(9,9,9,0.86);
      backdrop-filter: blur(18px);
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-decoration: none;
      transition: color 0.25s;
    }
    .back-link:hover { color: var(--gold-bright); }
    .back-link::before { content: '←'; color: var(--gold); font-size: 15px; }
    .brand {
      color: var(--gold);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }
    .reading-progress {
      position: fixed;
      inset: 57px auto auto 0;
      z-index: 51;
      width: 0;
      height: 1px;
      background: var(--gold);
      box-shadow: 0 0 12px rgba(201,169,110,0.7);
    }
    .layout {
      display: grid;
      grid-template-columns: 230px minmax(0, 900px);
      gap: clamp(34px, 5vw, 72px);
      width: min(1220px, calc(100% - 48px));
      margin: 0 auto;
      padding: 64px 0 100px;
    }
    .toc-shell { min-width: 0; }
    .toc {
      position: sticky;
      top: 92px;
      max-height: calc(100vh - 124px);
      overflow-y: auto;
      padding: 20px 0 20px 18px;
      border-left: 1px solid var(--line);
      scrollbar-width: thin;
      scrollbar-color: var(--line-gold) transparent;
    }
    .toc-label {
      display: block;
      margin-bottom: 14px;
      color: var(--gold);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.28em;
    }
    .toc a {
      display: block;
      margin-left: -19px;
      padding: 7px 10px 7px 18px;
      border-left: 2px solid transparent;
      color: var(--subtle);
      font-size: 10px;
      line-height: 1.55;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .toc a:hover,
    .toc a.active {
      border-left-color: var(--gold);
      background: linear-gradient(90deg, var(--gold-soft), transparent);
      color: var(--text);
    }
    .report { min-width: 0; }
    .loading,
    .load-error {
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.9;
    }
    .load-error a { color: var(--gold-bright); }
    .report > h1:first-child {
      position: relative;
      margin: 0 0 24px;
      padding: 84px 0 30px;
      font-family: var(--serif);
      font-size: clamp(3.1rem, 7.2vw, 6.4rem);
      font-weight: 300;
      letter-spacing: 0.07em;
      line-height: 0.98;
    }
    .report > h1:first-child::before {
      content: 'BDX / MOVEMENT SYSTEM';
      position: absolute;
      top: 28px;
      left: 0;
      color: var(--gold);
      font-family: var(--sans);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.32em;
    }
    .report > h1:first-child::after {
      content: '';
      display: block;
      width: 64px;
      height: 1px;
      margin-top: 30px;
      background: var(--gold);
    }
    .report > h1:first-child + blockquote {
      margin: 0 0 34px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-family: var(--serif);
      font-size: clamp(1.15rem, 2.2vw, 1.55rem);
      letter-spacing: 0.05em;
      line-height: 1.8;
    }
    .report h2 {
      scroll-margin-top: 84px;
      margin: 96px 0 28px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
      font-family: var(--serif);
      font-size: clamp(2rem, 4.3vw, 3.7rem);
      font-weight: 300;
      letter-spacing: 0.05em;
      line-height: 1.2;
    }
    .report h2::before {
      content: attr(data-index);
      display: block;
      margin-bottom: 12px;
      color: var(--gold);
      font-family: var(--sans);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.28em;
    }
    .report h3 {
      scroll-margin-top: 84px;
      margin: 52px 0 18px;
      color: var(--text);
      font-family: var(--serif);
      font-size: clamp(1.4rem, 2.7vw, 2rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1.4;
    }
    .report h4 {
      margin: 34px 0 14px;
      color: var(--gold-bright);
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.06em;
    }
    .report p,
    .report li {
      color: var(--muted);
      font-size: 0.91rem;
      line-height: 2;
      letter-spacing: 0.035em;
    }
    .report p { margin: 14px 0; }
    .report strong { color: var(--text); font-weight: 500; }
    .report ul,
    .report ol { margin: 18px 0 28px; padding-left: 1.5em; }
    .report li { margin: 8px 0; padding-left: 0.25em; }
    .report li::marker { color: var(--gold); }
    .report blockquote {
      margin: 28px 0;
      padding: 20px 24px;
      border: 1px solid var(--line-gold);
      border-left: 3px solid var(--gold);
      border-radius: 0 var(--radius) var(--radius) 0;
      background: linear-gradient(90deg, var(--gold-soft), rgba(255,255,255,0.015));
    }
    .report blockquote p { margin: 0; color: #d6cec4; }
    .report hr {
      height: 1px;
      margin: 76px 0;
      border: 0;
      background: linear-gradient(90deg, transparent, var(--line-gold), transparent);
    }
    .report table {
      display: table;
      width: 100%;
      margin: 24px 0 38px;
      border-collapse: separate;
      border-spacing: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,0.018);
      font-size: 11px;
      line-height: 1.65;
    }
    .report th,
    .report td {
      padding: 12px 13px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      text-align: left;
    }
    .report th:last-child,
    .report td:last-child { border-right: 0; }
    .report tr:last-child td { border-bottom: 0; }
    .report th {
      background: rgba(201,169,110,0.1);
      color: var(--gold-bright);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .report td { color: #bcb4aa; }
    .report tbody tr:hover td { background: rgba(201,169,110,0.035); }
    .report table.movement-spec { table-layout: fixed; }
    .report table.movement-spec th:nth-child(1) { width: 18%; }
    .report table.movement-spec th:nth-child(2) { width: 13%; text-align: center; }
    .report table.movement-spec th:nth-child(3) { width: 27%; }
    .report table.movement-spec th:nth-child(4) { width: 18%; }
    .report table.movement-spec th:nth-child(5) { width: 24%; }
    .report table.movement-spec td:nth-child(2) {
      color: var(--gold-bright);
      font-weight: 600;
      text-align: center;
    }
    .report table.progression-spec { table-layout: fixed; }
    .report table.progression-spec th:nth-child(1) { width: 14%; }
    .report table.progression-spec th:nth-child(2) { width: 16%; }
    .report table.progression-spec th:nth-child(3) { width: 18%; }
    .report table.progression-spec th:nth-child(4) { width: 18%; }
    .report table.progression-spec th:nth-child(5) { width: 29%; }
    .report table.progression-spec th:nth-child(6) { width: 5%; text-align: center; }
    .report table.progression-spec td:nth-child(6) {
      color: var(--gold-bright);
      font-weight: 600;
      text-align: center;
    }
    .report code {
      color: #e2c58e;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.86em;
    }
    .report p code,
    .report td code {
      padding: 2px 6px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: rgba(255,255,255,0.04);
    }
    .report pre {
      margin: 24px 0 34px;
      padding: 20px 22px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #0d0d0d;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .report pre code { color: #d5cec5; font-size: 11px; line-height: 1.9; }
    .mermaid {
      margin: 26px 0 38px;
      padding: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.02);
      text-align: center;
    }
    .mermaid svg { display: block; max-width: 100% !important; height: auto !important; margin: 0 auto; }
    .source-note {
      margin-top: 86px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      color: var(--subtle);
      font-size: 9px;
      letter-spacing: 0.1em;
    }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; width: min(900px, calc(100% - 40px)); padding-top: 28px; }
      .toc-shell { display: none; }
      .report > h1:first-child { padding-top: 74px; }
    }
    @media (max-width: 680px) {
      .site-header { min-height: 52px; padding: 0 16px; }
      .brand { font-size: 8px; letter-spacing: 0.18em; }
      .back-link { font-size: 9px; }
      .reading-progress { top: 51px; }
      .layout { width: min(100% - 28px, 900px); padding: 12px 0 70px; }
      .report > h1:first-child { padding-top: 70px; font-size: clamp(2.5rem, 13vw, 4rem); letter-spacing: 0.035em; }
      .report h2 { margin-top: 72px; padding-top: 24px; }
      .report h3 { margin-top: 42px; }
      .report p,
      .report li { font-size: 0.87rem; line-height: 1.9; }
      .report blockquote { padding: 18px; }
      .report table,
      .report thead,
      .report tbody,
      .report tr,
      .report th,
      .report td { display: block; width: 100%; }
      .report table { border: 0; border-radius: 0; background: transparent; }
      .report thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .report tbody { display: grid; gap: 10px; }
      .report tr {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(255,255,255,0.02);
      }
      .report td {
        display: grid;
        grid-template-columns: minmax(88px, 0.36fr) minmax(0, 1fr);
        gap: 12px;
        padding: 10px 12px;
        border-right: 0;
        color: #c6beb5;
        font-size: 10px;
      }
      .report td::before {
        content: attr(data-label);
        color: var(--gold);
        font-size: 8px;
        font-weight: 600;
        letter-spacing: 0.05em;
      }
      .report tr:last-child td { border-bottom: 1px solid var(--line); }
      .report tr td:last-child { border-bottom: 0; }
      .report table.movement-spec td:first-child,
      .report table.progression-spec td:first-child {
        display: block;
        padding: 14px 12px;
        background: linear-gradient(90deg, var(--gold-soft), transparent);
        color: var(--text);
        font-family: var(--serif);
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.04em;
      }
      .report table.movement-spec td:first-child::before,
      .report table.progression-spec td:first-child::before { display: none; }
      .report table.movement-spec td:nth-child(2) { text-align: left; }
      .report table.progression-spec td:nth-child(6) { text-align: left; }
      .report pre { padding: 16px; }
      .mermaid { padding: 14px 8px; }
    }
    @media print {
      :root { --bg: #fff; --surface: #fff; --surface-hi: #fff; --text: #171717; --muted: #424242; --subtle: #777; --line: #d8d3cc; --line-gold: #b79b65; }
      body { background: #fff; color: #171717; }
      .site-header,
      .reading-progress,
      .toc-shell { display: none !important; }
      .layout { display: block; width: auto; margin: 0; padding: 0; }
      .report > h1:first-child { padding-top: 32mm; page-break-after: avoid; }
      .report h2 { margin-top: 18mm; page-break-after: avoid; }
      .report h3 { page-break-after: avoid; }
      .report p,
      .report li,
      .report td { color: #333; }
      .report table { font-size: 7.4pt; page-break-inside: auto; }
      .report tr { page-break-inside: avoid; }
      .report th { color: #6e562c; background: #f4efe6; }
      .report blockquote,
      .report pre,
      .mermaid { page-break-inside: avoid; background: #faf8f4; }
      .source-note { display: none; }
      @page { size: A4 portrait; margin: 15mm; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="./">コンテンツ制作</a>
    <span class="brand">Body Design Experience</span>
  </header>
  <div class="reading-progress" id="reading-progress" aria-hidden="true"></div>

  <main class="layout">
    <aside class="toc-shell" aria-label="ページ内ナビゲーション">
      <nav class="toc" id="toc"><span class="toc-label">CONTENTS</span></nav>
    </aside>
    <article class="report" id="report" aria-live="polite">
      <p class="loading">BDX バレエ動作体系を読み込んでいます。</p>
    </article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    (() => {
      const report = document.getElementById('report');
      const toc = document.getElementById('toc');
      const progress = document.getElementById('reading-progress');
      const markdownUrl = '../../docs/content/BDX_BALLET_MOVEMENT_SYSTEM_V1_1.md';

      const makeId = (text, index) => {
        const normalized = text
          .trim()
          .toLowerCase()
          .replace(/[\s　]+/g, '-')
          .replace(/[^\p{L}\p{N}ー・-]/gu, '')
          .replace(/-+/g, '-')
          .replace(/^-|-$/g, '');
        return normalized || `section-${index + 1}`;
      };

      const prepareTables = () => {
        report.querySelectorAll('table').forEach((table) => {
          const previous = table.previousElementSibling;
          if (previous && previous.tagName === 'H3' && previous.textContent.trim() === '動作一覧') {
            table.classList.add('movement-spec');
          }
          if (previous && previous.tagName === 'H3' && previous.textContent.trim() === '発展と注意点') {
            table.classList.add('progression-spec');
          }
          const labels = Array.from(table.querySelectorAll('thead th')).map((cell) => cell.textContent.trim());
          table.querySelectorAll('tbody tr').forEach((row) => {
            Array.from(row.children).forEach((cell, index) => {
              cell.dataset.label = labels[index] || `項目 ${index + 1}`;
            });
          });
        });
      };

      const prepareNavigation = () => {
        const headings = Array.from(report.querySelectorAll('h2'));
        const used = new Set();
        headings.forEach((heading, index) => {
          let id = makeId(heading.textContent, index);
          while (used.has(id)) id = `${id}-${index + 1}`;
          used.add(id);
          heading.id = id;
          const numbered = heading.textContent.match(/^(\d+)\./);
          heading.dataset.index = numbered
            ? numbered[1].padStart(2, '0')
            : heading.textContent.startsWith('付録')
              ? 'APPENDIX'
              : 'CONTENTS';
          const link = document.createElement('a');
          link.href = `#${id}`;
          link.textContent = heading.textContent;
          toc.appendChild(link);
        });

        const links = Array.from(toc.querySelectorAll('a'));
        const observer = new IntersectionObserver((entries) => {
          const visible = entries.filter((entry) => entry.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
          if (!visible) return;
          links.forEach((link) => link.classList.toggle('active', link.getAttribute('href') === `#${visible.target.id}`));
        }, { rootMargin: '-18% 0px -70% 0px', threshold: 0 });
        headings.forEach((heading) => observer.observe(heading));
      };

      const prepareMermaid = async () => {
        const nodes = [];
        report.querySelectorAll('pre code.language-mermaid').forEach((code) => {
          const diagram = document.createElement('div');
          diagram.className = 'mermaid';
          diagram.textContent = code.textContent;
          code.parentElement.replaceWith(diagram);
          nodes.push(diagram);
        });
        if (!nodes.length || !window.mermaid) return;
        window.mermaid.initialize({
          startOnLoad: false,
          theme: 'dark',
          securityLevel: 'strict',
          fontFamily: "Inter, 'Noto Sans JP', sans-serif",
          themeVariables: {
            primaryColor: '#191714',
            primaryTextColor: '#f2ede6',
            primaryBorderColor: '#c9a96e',
            lineColor: '#c9a96e',
            secondaryColor: '#121212',
            tertiaryColor: '#0d0d0d'
          },
          flowchart: { curve: 'basis', htmlLabels: true }
        });
        await window.mermaid.run({ nodes });
      };

      const updateProgress = () => {
        const max = document.documentElement.scrollHeight - window.innerHeight;
        const ratio = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
        progress.style.width = `${ratio * 100}%`;
      };
      window.addEventListener('scroll', updateProgress, { passive: true });

      const load = async () => {
        try {
          const response = await fetch(markdownUrl, { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          if (!window.marked) throw new Error('Markdown renderer unavailable');
          const markdown = await response.text();
          report.innerHTML = window.marked.parse(markdown, { gfm: true, breaks: false });
          prepareTables();
          prepareNavigation();
          await prepareMermaid();
          const note = document.createElement('p');
          note.className = 'source-note';
          note.textContent = 'SOURCE OF TRUTH · BDX_BALLET_MOVEMENT_SYSTEM_V1_1.md';
          report.appendChild(note);
          updateProgress();
        } catch (error) {
          report.innerHTML = `<div class="load-error">資料を読み込めませんでした。<br><a href="${markdownUrl}">Markdown版を開く</a></div>`;
        }
      };

      load();
    })();
  </script>
  <noscript>
    <p class="load-error"><a href="../../docs/content/BDX_BALLET_MOVEMENT_SYSTEM_V1_1.md">Markdown版を開く</a></p>
  </noscript>
</body>
</html>
